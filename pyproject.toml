[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privio-sentry"
version = "5.4.0"
description = "PRIVIO SENTRY - Local AI Privacy Infrastructure. SENTRY Redact: local OCR + YOLO + vision LLM pipeline that suggests redactions of CPF numbers and personal addresses in PDFs, with human review. Supports LGPD-aligned practices; does not guarantee anonymization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Joberth Firmino Gambati" }]
keywords = ["lgpd", "redaction", "pdf", "ocr", "yolo", "privacy", "pii", "cpf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "Jinja2>=3.1",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "PyMuPDF>=1.24",        # AGPL-3.0 -- see docs/licensing.md
  "pillow>=10.0",
  "pytesseract>=0.3.10",
  "ultralytics>=8.3",     # AGPL-3.0 -- see docs/licensing.md
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "pytest-cov>=7.0", "ruff==0.16.10"]
ui = ["pytest-playwright>=0.7"]
# Decisor local opcional (modelo de decisão calibrado Laya, Apache-2.0) + certificados do sistema
# (redes com proxy/inspeção TLS). Ver docs/decisions.md.
laya = ["laya==0.3.26", "truststore==0.10.4"]  # versões exatas (cadeia de suprimentos)
# Detector opcional de nomes de pessoa (GLiNER, local; NER_ENGINE=gliner). Ver docs/configuration.md.
nomes = ["gliner==0.2.29", "protobuf==7.36.2", "truststore==0.10.4"]

[project.urls]
Homepage = "https://github.com/Yiuky/PrivioSentry"
Issues = "https://github.com/Yiuky/PrivioSentry/issues"
Changelog = "https://github.com/Yiuky/PrivioSentry/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["main", "app_service", "gatekeeper"]
packages = ["utils", "utils.decisions", "utils.detect"]

[tool.setuptools.package-data]
"utils.detect" = ["data/*.json"]  # regras e limiares como dados (utils/detect/config.py)

# ---------------------------------------------------------------------------
# Ruff (lint only; this project does not enforce an auto-formatter yet)
# pytest options live in pytest.ini
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv", "experimental", "output", "WEB_INPUT", "documentos_finais", "input"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
  "E501",  # long lines: tolerated (prompts / log strings)
  "E402",  # module-level import not at top (os.environ set before heavy imports)
  "E701",  # one-line compound statements
  "E702",
  "E741",  # ambiguous variable names (l, O, I) used in legacy code
  "B008",  # FastAPI Depends/File defaults
  "B904",  # raise ... from err
  # Legacy style issues in existing code; tighten later (not auto-fixed to avoid noisy diffs):
  "W291", "W292", "W293",  # trailing whitespace / missing final newline
  "E722",  # bare except
  "B007", "B905",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E731"]
"scripts/**" = ["E402"]
