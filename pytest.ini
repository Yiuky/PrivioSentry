[pytest]
# Coleta so tests/ (inclui tests/ui, Playwright). scripts/ e experimental/ tem arquivos test_*.py que sao
# experimentos manuais (chamam o Ollama ao importar) e nao podem ser coletados. Para so a suite rapida:
#   pytest -q --ignore=tests/ui -m "not slow"
testpaths = tests
markers =
    integration: ponta a ponta com Tesseract real (skip se ausente)
    slow: testes que levam varios segundos (OCR em paginas inteiras)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
    ignore:(?s).*on_event is deprecated.*:DeprecationWarning
