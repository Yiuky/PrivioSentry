# Publica a GitHub Release ao enviar uma tag vX.Y.Z:
#   git tag v5.1.0 && git push origin v5.1.0
# Nada é publicado se a versão divergir (pyproject.toml, CITATION.cff, CHANGELOG.md e a tag) ou se a suíte
# falhar no commit da tag. As notas da Release vêm da seção da versão no CHANGELOG.md.
# Versões com sufixo (ex.: 5.2.0-rc.1) saem como pre-release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente a publicar (ex.: v5.1.0)"
        required: true

# Mínimo privilégio: só o job que publica recebe escrita. O job de testes instala dependências de
# terceiros e não deve ter um token capaz de alterar o repositório.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Consistência de versão, tag e CHANGELOG
        run: python scripts/check_versions.py --tag "$TAG"
      - name: Auditoria de dados pessoais e segredos
        run: python scripts/audit_public_tree.py
      - name: Instalar o Tesseract (com português)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por tesseract-ocr-eng libgl1
      - name: Dependências (PyTorch só CPU)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Suíte (sem os testes de interface, que já rodam no CI)
        run: pytest --ignore=tests/ui

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Extrair notas do CHANGELOG
        shell: python
        run: |
          import io, os, re
          version = os.environ["TAG"].lstrip("v")
          log = io.open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(r"^## \[%s\].*?$(.*?)(?=^## \[|\Z)" % re.escape(version), log, re.M | re.S)
          notes = m.group(1).strip() if m else "PRIVIO SENTRY %s" % version
          notes += ("\n\n---\n**Instalação:** veja o [README](https://github.com/Yiuky/PrivioSentry#-instalação). "
                    "A ferramenta apoia a revisão humana e **não garante** anonimização.")
          io.open("release_notes.md", "w", encoding="utf-8").write(notes)
      - name: Publicar Release
        run: |
          EXTRA=""
          if [[ "${TAG#v}" == *-* ]]; then EXTRA="--prerelease"; fi
          gh release create "$TAG" --title "PRIVIO SENTRY $TAG" --notes-file release_notes.md --verify-tag $EXTRA
