# Servidor de IA local no cluster (opcional): pode rodar num nó com GPU, separado do app. Para usar outro servidor
# (LM Studio, vLLM, servidor da organização), remova este arquivo do kustomization.yaml e ajuste AI_BASE_URL.
# Baixe os modelos uma vez:  kubectl -n privio-sentry exec deploy/ollama -- ollama pull gemma4:e4b
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ollama
          # Fixe uma versão conferida (cadeia de suprimentos): ollama/ollama:<versão>
          image: ollama/ollama:latest
          env:
            - name: HOME
              value: /models
            - name: OLLAMA_MODELS
              value: /models
          ports:
            - name: api
              containerPort: 11434
          readinessProbe:
            httpGet:
              path: /api/tags
              port: api
            periodSeconds: 15
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 16Gi
              # GPU NVIDIA (com o device plugin instalado):
              # nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - name: api
      port: 11434
      targetPort: api
